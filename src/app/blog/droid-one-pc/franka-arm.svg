<style>
#franka-arm .sil,#franka-arm .det,#franka-arm .acc{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#franka-arm{--k:1}
@media (max-width:700px){#franka-arm{--k:.62}}
#franka-arm .sil{fill:#000000;stroke:#FFFFFF;stroke-width:calc(var(--k)*1.7px);fill-rule:evenodd}
#franka-arm .det{fill:none;stroke:#FFFFFF;stroke-width:calc(var(--k)*0.55px)}
#franka-arm .sil.fine{stroke-width:calc(var(--k)*0.95px)}
#franka-arm .det.fine{stroke-width:calc(var(--k)*0.45px)}
#franka-arm .acc{fill:none;stroke:#FF6A00;stroke-width:calc(var(--k)*2.0px)}
#franka-arm #arm-light{stroke:#FFFFFF;transition:fill .2s,stroke .2s,filter .2s}
#franka-arm:hover #arm-light{fill:#FF3B30;stroke:#FF3B30;filter:drop-shadow(0 0 5px #FF3B30)}
</style>
